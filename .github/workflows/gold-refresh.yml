name: Refresh Alpha Seeker Gold Pulse

on:
  schedule:
    # Four refreshes an hour are enough for the monitoring UI, avoid the
    # top-of-hour Actions queue, and skip weekends when the signal is idle.
    - cron: '7,22,37,52 * * * 1-5'
  workflow_dispatch:

concurrency:
  group: alpha-seeker-gold-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refresh adaptive Gold signal
        env:
          GOLD_REFRESH_URL: ${{ vars.GOLD_REFRESH_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$GOLD_REFRESH_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --max-time 90 \
            --retry 2 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${GOLD_REFRESH_URL%/}/api/gold-daytrade?scheduled=1"
